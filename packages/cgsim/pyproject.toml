[project]
name = "cgsim"
version = "0.1.0"
description = "AskCGSim Bamboo MCP plugin — SimGrid-based distributed computing simulator"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."bamboo.tools"]
"cgsim.doc_search"  = "cgsim.doc_rag:cgsim_doc_search_tool"
"cgsim.doc_bm25"    = "cgsim.doc_bm25:cgsim_doc_bm25_tool"
"cgsim.ui_manifest" = "cgsim.ui_manifest:cgsim_ui_manifest_tool"

# Future tools (not yet implemented):
# "cgsim.sim_query"           = "cgsim.sim_query:cgsim_sim_query_tool"
# "cgsim.site_status"         = "cgsim.site_status:cgsim_site_status_tool"
# "cgsim.calibration_results" = "cgsim.calibration_results:cgsim_calibration_results_tool"
# "cgsim.event_monitor"       = "cgsim.event_monitor:cgsim_event_monitor_tool"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cgsim"]

[tool.setuptools.package-data]
cgsim = ["banner.txt"]
